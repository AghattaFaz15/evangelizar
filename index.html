<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Selá • Pausa. Respira. Permaneça.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

  <style>

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;

      background:
        linear-gradient(rgba(15,10,5,0.55), rgba(15,10,5,0.68)),
        url('fundo-sela.jpg') no-repeat center center fixed;

      background-size: cover;

      font-family: 'Cormorant Garamond', serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #e0c48f;

      text-align: center;

      backdrop-filter: blur(2px);
    }

    #logo {
      position: absolute;
      top: 35px;

      font-size: 4.8rem;
      font-weight: 300;

      color: #d8b06a;

      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }

    #subtitulo {
      position: absolute;
      top: 118px;

      font-size: 0.9rem;
      letter-spacing: 6px;

      color: rgba(255,255,255,0.72);
    }

    #mensagem-container {

      width: 85%;
      max-width: 500px;

      font-size: 2rem;
      font-weight: 300;

      letter-spacing: 1px;
      line-height: 1.5;

      color: #f1dfb6;

      text-shadow: 0 2px 10px rgba(0,0,0,0.55);

      margin-bottom: 90px;

      transition: opacity 0.5s ease;
    }

    #botoes {

      position: fixed;

      bottom: 70px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      gap: 15px;

      width: 90%;
      max-width: 700px;

      justify-content: center;
    }

    button {

      flex: 1;

      background: rgba(35,22,12,0.78);

      border: 1px solid rgba(224,196,143,0.45);

      color: #f0d7a1;

      padding: 14px 24px;

      border-radius: 14px;

      font-size: 1.2rem;

      font-family: 'Cormorant Garamond', serif;

      backdrop-filter: blur(5px);

      cursor: pointer;

      transition: all 0.3s ease;

      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    button:hover {

      transform: translateY(-3px);

      background: rgba(70,45,20,0.88);

      box-shadow: 0 6px 22px rgba(0,0,0,0.35);
    }

    #rodape {

      position: absolute;

      bottom: 18px;

      font-size: 0.95rem;

      letter-spacing: 1px;
    }

    #rodape a {

      color: rgba(255,255,255,0.65);

      text-decoration: none;

      transition: 0.3s ease;
    }

    #rodape a:hover {

      color: #e0c48f;
    }

    @media (max-width: 600px) {

      #logo {
        font-size: 4rem;
      }

      #subtitulo {
        font-size: 0.75rem;
        letter-spacing: 4px;
      }

      #mensagem-container {
        font-size: 1.7rem;
      }

      #botoes {
        gap: 10px;
      }

      button {
        font-size: 1rem;
        padding: 14px 10px;
      }

    }

  </style>
</head>

<body>

  <div id="logo">Selá</div>

  <div id="subtitulo">
    PAUSA • RESPIRA • PERMANECE
  </div>

  <div id="mensagem-container">
    Há lugares onde Deus fala baixo.
  </div>

  <div id="botoes">

    <button id="btnHinos">
      🎵 Hinos
    </button>

    <button id="btnMensagens">
      📖 Palavra do Dia
    </button>

  </div>

  <div id="rodape">

    <a href="https://instagram.com/sela.canecas"
       target="_blank">

       ☕ @sela.canecas

    </a>

  </div>

  <audio id="audioHino" preload="auto"></audio>

  <script>

    const btnHinos =
      document.getElementById('btnHinos');

    const btnMensagens =
      document.getElementById('btnMensagens');

    const mensagemContainer =
      document.getElementById('mensagem-container');

    const audioElement =
      document.getElementById('audioHino');

    const audiosDisponiveis = [

      'audio1.mp3',
      'audio2.mp3',
      'audio3.mp3',
      'audio4.mp3',
      'audio5.mp3',
      'audio6.mp3',
      'audio7.mp3',
      'audio8.mp3',
      'audio9.mp3',
      'audio10.mp3',
      'audio11.mp3',
      'audio12.mp3',
      'audio13.mp3',
      'audio14.mp3',
      'audio15.mp3',
      'audio16.mp3',
      'audio17.mp3',
      'audio18.mp3',
      'audio19.mp3',
      'audio20.mp3',
      'audio21.mp3',
      'audio22.mp3',
      'audio23.mp3'

    ];

    btnHinos.addEventListener('click', () => {

      const escolhido =

        audiosDisponiveis[
          Math.floor(
            Math.random() *
            audiosDisponiveis.length
          )
        ];

      audioElement.src = escolhido;

      audioElement.play().catch(() => {

        mensagemContainer.innerHTML =
          "Toque novamente para ouvir o hino 🎵";

      });

    });

    let mensagemPronta = false;

    const iframeMensagem =
      document.createElement('iframe');

    iframeMensagem.src = 'mensagem.html';

    iframeMensagem.style.display = 'none';

    document.body.appendChild(iframeMensagem);

    window.addEventListener('message', event => {

      if (
        event.source ===
        iframeMensagem.contentWindow
      ) {

        if (
          event.data.type ===
          'mensagemPronta'
        ) {

          mensagemPronta = true;

        }

        else if (
          event.data.type ===
          'novaMensagemTexto'
        ) {

          mensagemContainer.style.opacity = 0;

          setTimeout(() => {

            mensagemContainer.innerHTML =
              event.data.texto;

            mensagemContainer.style.opacity = 1;

          }, 400);

        }

      }

    });

    btnMensagens.addEventListener('click', () => {

      if (mensagemPronta) {

        iframeMensagem.contentWindow.postMessage(

          { type: 'novaMensagem' },

          '*'

        );

      }

    });

  </script>

</body>
</html>
