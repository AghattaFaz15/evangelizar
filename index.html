<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Selá • Pausa. Respira. Permaneça.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;

      background:
        linear-gradient(rgba(8,8,8,0.55), rgba(8,8,8,0.65)),
        url('fundo-sela.jpg') no-repeat center center fixed;

      background-size: cover;

      font-family: 'Cormorant Garamond', serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: #e0c48f;

      text-align: center;
    }

    #mensagem-container {
      width: 80%;
      max-width: 700px;

      padding: 25px;

      font-size: 2rem;
      line-height: 1.5;

      color: #f1dfb6;

      text-shadow: 0 2px 10px rgba(0,0,0,0.6);

      transition: opacity 0.5s ease;

      margin-bottom: 140px;
    }

    #logo {
      position: absolute;
      top: 40px;

      font-size: 4rem;
      font-weight: 300;
      letter-spacing: 2px;

      color: #d8b06a;

      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    #subtitulo {
      position: absolute;
      top: 105px;

      font-size: 1.1rem;
      letter-spacing: 4px;

      color: rgba(255,255,255,0.75);
    }

    #botoes {
      position: fixed;

      bottom: 45px;
      left: 50%;

      transform: translateX(-50%);

      display: flex;
      gap: 20px;

      width: 90%;
      max-width: 700px;

      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: rgba(30,20,10,0.72);

      border: 1px solid rgba(224,196,143,0.5);

      color: #f0d7a1;

      padding: 18px 28px;

      border-radius: 18px;

      font-size: 1.2rem;

      font-family: 'Cormorant Garamond', serif;

      backdrop-filter: blur(5px);

      cursor: pointer;

      transition: all 0.3s ease;

      min-width: 180px;

      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    button:hover {
      transform: translateY(-3px);

      background: rgba(50,35,20,0.82);

      box-shadow: 0 6px 22px rgba(0,0,0,0.45);
    }

    #rodape {
      position: absolute;
      bottom: 10px;

      font-size: 0.9rem;

      color: rgba(255,255,255,0.55);

      letter-spacing: 1px;
    }

    @media (max-width: 600px) {

      #logo {
        font-size: 3rem;
      }

      #mensagem-container {
        font-size: 1.6rem;
        width: 88%;
      }

      button {
        width: 100%;
      }

    }

  </style>
</head>

<body>

  <div id="logo">Selá</div>
  <div id="subtitulo">PAUSA • RESPIRA • PERMANECE</div>

  <div id="mensagem-container">
    Há lugares onde Deus fala baixo.
  </div>

  <div id="botoes">

    <button id="btnHinos">
      🎵 Hinos
    </button>

    <button id="btnMensagens">
      📖 Palavra do Dia
    </button>

  </div>

  <div id="rodape">
    @selacanecas
  </div>

  <audio id="audioHino" preload="auto"></audio>

  <script>

    const btnHinos = document.getElementById('btnHinos');
    const btnMensagens = document.getElementById('btnMensagens');
    const mensagemContainer = document.getElementById('mensagem-container');
    const audioElement = document.getElementById('audioHino');

    const audiosDisponiveis = [

      'audio1.mp3',
      'audio2.mp3',
      'audio3.mp3',
      'audio4.mp3',
      'audio5.mp3',
      'audio6.mp3',
      'audio7.mp3',
      'audio8.mp3',
      'audio9.mp3',
      'audio10.mp3',
      'audio11.mp3',
      'audio12.mp3',
      'audio13.mp3',
      'audio14.mp3',
      'audio15.mp3',
      'audio16.mp3',
      'audio17.mp3',
      'audio18.mp3',
      'audio19.mp3',
      'audio20.mp3',
      'audio21.mp3',
      'audio22.mp3',
      'audio23.mp3'

    ];

    btnHinos.addEventListener('click', () => {

      const escolhido =
        audiosDisponiveis[Math.floor(Math.random() * audiosDisponiveis.length)];

      audioElement.src = escolhido;

      audioElement.play().catch(() => {

        mensagemContainer.innerHTML =
          "Toque novamente para ouvir o hino 🎵";

      });

    });

    let mensagemPronta = false;

    const iframeMensagem = document.createElement('iframe');

    iframeMensagem.src = 'mensagem.html';

    iframeMensagem.style.display = 'none';

    document.body.appendChild(iframeMensagem);

    window.addEventListener('message', event => {

      if (event.source === iframeMensagem.contentWindow) {

        if (event.data.type === 'mensagemPronta') {

          mensagemPronta = true;

        }

        else if (event.data.type === 'novaMensagemTexto') {

          mensagemContainer.style.opacity = 0;

          setTimeout(() => {

            mensagemContainer.innerHTML = event.data.texto;

            mensagemContainer.style.opacity = 1;

          }, 400);

        }

      }

    });

    btnMensagens.addEventListener('click', () => {

      if (mensagemPronta) {

        iframeMensagem.contentWindow.postMessage(
          { type: 'novaMensagem' },
          '*'
        );

      }

    });

  </script>

</body>
</html>
